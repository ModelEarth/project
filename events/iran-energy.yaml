  reported_scope:
    - IAEA June 2025 safeguards report total Iranian enriched uranium stockpile 9874.9 kg
    - 60%-enriched HEU sub-stockpile 440.9 kg as of June 2025
    - 5%-enriched sub-stockpile 6024.4 kg
    - Breakout timeline to weapons-grade from current 60% HEU stock estimated at approximately 3 weeks
    - Notional weapons equivalence approximately 9 weapons from the 60% HEU stockpile at 90%+ enrichment
    - Bushehr 1 desalination 70000 m3/day operational since August 2022 co-located with 1000 MWe VVER
    - Bushehr Units 2 and 3 reported 18% construction complete commercial operation target 2029
    - Iran classified extremely high water stress by WRI more than 80% renewable water used annually
    - 16 million people displaced due to water scarcity as of 2025
    - Tehran reservoir capacity 12% of rated volume as of 2025
    - Experts warned of apocalyptic scenario with 2-3 weeks to prevent nationwide shortage July 2025
