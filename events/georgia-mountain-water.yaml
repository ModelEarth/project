  source_url: https://epd.georgia.gov/watershed-protection
  published_date: 2025-09
  scenario_name: North Georgia Blue Ridge Watershed Revival and Rural Water Security Initiative
  corridor_parties: [Georgia EPD, US Forest Service, TVA, Mountain communities, Georgia Tech Water Institute, USDA Rural Development]
  status: Planning phase — stakeholder alignment in progress as of 2026
  reported_scope:
    - North Georgia mountains supply drinking water to approximately 7 million Atlanta metro residents via the Chattahoochee River
    - Blue Ridge, Cohutta, and Toccoa watersheds degraded by legacy mining, clear-cutting runoff, and agricultural contamination
    - Approximately 240 miles of mountain streams assessed as impaired under EPA 303(d) listing
    - 38 rural mountain counties rely on aging water infrastructure with median system age over 55 years
    - Drought stress index for North Georgia classified as high by NOAA; increasing in frequency and severity
    - Georgia groundwater recharge zones in mountain valleys face increasing impervious surface pressure
    - Cherokee, Lumpkin, Union, and Towns counties have documented nitrate and sediment exceedances
