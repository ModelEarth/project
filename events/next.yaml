# Data the goals page reads. Sample: files in goals/data/toy. Live: the
# sources below, by id in goals/pipeline/sources.json.
data:
  sample_scope: AL-FL-GA-NC-SC-TN
  live_sources: [community-industries, upstream-directory]
  industry_year: 2023

# RealityStream forecasts, run with:
#   python models/run.py events/next.yaml               (all forecasts)
#   python models/run.py events/next.yaml --forecast orgs
# Each entry is a RealityStream parameters block. Relative paths resolve
# against this file. Features are county industry levels for 2023 from the
# community-data repository: employees (Emp-XX), establishments (Est-XX) and
# annual payroll (Pay-XX) by 2-digit NAICS sector, plus population. Files
# come from goals/pipeline/county_pipeline.py. Point features.path or
# targets.path at any URL or file with a Fips column to forecast from another
# source. Evaluation holds out whole states, so a model can't succeed by
# memorizing one state's conventions.
forecasts:
  # Counties with a high density of veteran services: 1 when a county is in
  # the top quartile of resources per 10,000 people in the upstream veteran
  # resource directory (/api/coverage).
  services:
    folder: naics2-veteran-services-southeast
    features:
      data: industries
      common: Fips
      path: ../goals/data/AL-FL-GA-NC-SC-TN/county-features.csv
    targets:
      data: veteran-services
      common: Fips
      column: Target
      path: ../goals/data/AL-FL-GA-NC-SC-TN/county-targets.csv
    models: [lr, rfc, xgboost]
    split:
      test_size: 0.25
      random_state: 42
    search:
      n_iter: 10
    evaluation:
      cv: group
      folds: 6
  # Counties with a high density of veteran-serving organizations: 1 when a
  # county is in the top quartile of IRS-coded veteran organizations (NTEE
  # W30 or subsection 19) per 10,000 people.
  orgs:
    folder: naics2-veteran-orgs-southeast
    features:
      data: industries
      common: Fips
      path: ../goals/data/AL-FL-GA-NC-SC-TN/county-features.csv
    targets:
      data: veteran-orgs
      common: Fips
      column: Target
      path: ../goals/data/AL-FL-GA-NC-SC-TN/county-targets-orgs.csv
    models: [lr, rfc, xgboost]
    split:
      test_size: 0.25
      random_state: 42
    search:
      n_iter: 10
    evaluation:
      cv: group
      folds: 6
