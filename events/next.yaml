# true: three points of focus oscillate slowly over the hero photos, like an
# AI interface's light. Around each the photo is sharp and lit with a color
# that shifts through teal, blue, violet, rose and mint; elsewhere it's softly
# blurred and dimmed (goals.css .goals-focus, .goals-aurora). false or left
# out: the photos alone.
hero_atmosphere: true

