# Next Mission: goal automation for veterans.
# Opened with project/goals/#event=next. Not listed in events.json, so it
# stays off the /project page's event list.
id: next
label: Next Mission
kind: goals
mission_name: Next Mission
browser_title: Next Mission
# Shown in place of the localsite header logo, after an earth icon. Clicking
# it opens the Earth display, like the earth icon in Settings.
headerTitle: Next Mission
# Domain profile for the goals Worker (goals/worker/src/profiles/veterans.js).
profile: veterans
eyebrow: Goal automation for veterans
lede: Set goals for your Next Mission. Ask in your own words.
# Top info line shown on the goals page (here, crisis support). [label](href) makes a link
# (tel:, sms: and https: only).
topinfo_label: In crisis?
topinfo_text: 'Veterans Crisis Line: dial [988](tel:988), then press 1 · text [838255](sms:838255) · [chat online](https://www.veteranscrisisline.net/get-help-now/chat/)'

# Safety lines the goals Worker returns first whenever a request shows crisis
# language (crisis_support, ask, route_query, MCP), and lists in llms.txt.
# The veterans profile (goals/worker/src/profiles/veterans.js) reads them from
# here. channel: phone, sms or web; value: the number or URL.
safety_lines:
  - name: Veterans Crisis Line
    how: Dial 988, then press 1
    channel: phone
    value: "988"
  - name: Veterans Crisis Line (text)
    how: Text 838255
    channel: sms
    value: "838255"
  - name: Veterans Crisis Line (chat)
    how: Chat online
    channel: web
    value: https://www.veteranscrisisline.net/get-help-now/chat/
  - name: Emergency
    how: Call 911 if there is immediate danger
    channel: phone
    value: "911"

