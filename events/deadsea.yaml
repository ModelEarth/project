source_confirmed:
  primary_source: Wikipedia (Dead Sea; Red Sea-Dead Sea Water Conveyance; EcoPeace Middle East); CNN Dead Sea sinkholes report; World Bank Palestinian tourism estimate
  source_url: https://en.wikipedia.org/wiki/Dead_Sea
  published_date: 2025-09
  scenario_name: Dead Sea Basin Stabilization - Shared Water, Tourism and Agriculture Revival
  corridor_parties: [ICL Group / Dead Sea Works, Israel Water Authority, Jordan Ministry of Water and Irrigation, EcoPeace Middle East, Dead Sea hotel associations, World Bank]
  status: 'Concept - the 2005-2021 Red Sea-Dead Sea Conveyance was shelved by Jordan in 2021 citing lack of Israeli interest; smaller-scale cooperation (tourism levies, agricultural efficiency, EcoPeace-style pilots) remains an open path as of 2026'
  reported_scope:
    - ICL Group's Dead Sea Works withdraws an estimated 160 million cubic meters of water per year for mineral extraction
    - Dead Sea surface has shrunk roughly 33% since the 1960s, declining over 1 meter per year
    - Jordan River, historically the primary inflow, now contributes only about one-sixth of its historical share due to Israel's National Water Carrier (1964) and regional irrigation
    - Sinkholes from subsurface salt dissolution are widespread along the western shore near Ein Gedi, closing many beach resorts
    - Israel's 15 Dead Sea hotels generated $291 million in revenue in 2012
    - Jordan operates 9 international hotel franchises near the Dead Sea with 2,800 rooms
    - World Bank estimates Palestinian Dead Sea tourism could generate $290 million/year and 2,900 jobs, currently unrealized due to permit restrictions
    - A 2009 EcoPeace-backed pilot proposed a 180km Red Sea-to-Dead Sea pipeline moving 200 million cubic meters/year, half desalinated for Jordan and half returned to the Dead Sea
    - The full Red Sea-Dead Sea Conveyance was estimated at $2.5 billion for its first phase and $2-10+ billion overall before being shelved in 2021
