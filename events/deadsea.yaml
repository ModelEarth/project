concept_note: 'Concept event based on the Dead Sea decline scenario: ICL Group, through its Dead Sea Works subsidiary, withdraws an estimated 160 million cubic meters of water per year from the Dead Sea for mineral extraction, contributing (alongside the Jordan River''s National Water Carrier diversion) to a decline of over 1 meter per year and a roughly 33% shrinkage in surface area since the 1960s. As water recedes, freshwater dissolving subsurface salt layers has created widespread sinkholes along the western shore, especially near Ein Gedi, closing many beach resorts. ICL states it is innovating toward more sustainable water management strategies, and this event tracks a concept path toward reduced extraction, sinkhole mitigation, and basin stabilization.'
source_note: 'CNN: "In the lowest place on Earth, a sea is rapidly dying" (cnn.com/climate/dead-sea-shrinking-sinkholes); background from Wikipedia "Dead Sea" article.'
